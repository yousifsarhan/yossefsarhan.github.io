<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio - Motion</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&family=Akira+Expanded:wght@400&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #121212;
      color: white;
      text-align: center;
    }

    .navbar {
      display: flex;
      justify-content: center;
      background-color: transparent;
      padding: 15px 0;
      position: relative;
    }

    .navbar a {
      margin: 0 30px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      transition: color 0.3s ease;
    }

    .navbar a:hover,
    .navbar a:focus {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      outline: none;
    }

    h1 {
      margin: 40px 0;
      font-size: 48px;
      letter-spacing: 2px;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      margin: 20px 0;
      text-transform: uppercase;
      font-weight: bold;
      color: white;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      padding: 0 10%;
    }

    .video-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    video.content-video {
      width: 100%;
      height: auto;
      max-width: 82.5%;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      background-color: black;
    }

    .video-title {
      margin-top: 10px;
      font-size: 28px;
      font-weight: bold;
      color: white;
    }

    .video-description {
      font-size: 16px;
      margin-top: 5px;
      max-width: 300px;
      color: #E0E0E0;
    }

    .contact-section {
      margin: 40px 0;
      padding: 0 20px;
    }

    .contact-email {
      font-size: 16px;
      color: grey;
      margin-bottom: 20px;
    }

    @media (min-width: 769px) {
      .contact-icons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 60px;
        margin-top: 10px;
      }

      .contact-icons a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
      }

      .contact-icons a .social-text {
        color: grey;
      }

      .contact-icon {
        width: 30px;
        position: relative;
        top: 2px;
      }
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        align-items: center;
        padding: 20px 0;
      }

      .navbar a {
        margin: 10px 0;
        font-size: 16px;
      }

      h1 {
        font-size: 36px;
      }

      .section-title {
        font-size: 28px;
      }

      .videos {
        grid-template-columns: 1fr;
        padding: 0 5%;
      }

      .video-title {
        font-size: 22px;
      }

      .video-description {
        font-size: 14px;
        max-width: 90%;
      }

      .contact-icons {
        display: flex;
        justify-content: space-around;
        align-items: center;
        margin-top: 20px;
        width: 100%;
      }

      .contact-icons a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        text-decoration: none;
      }

      .contact-icons a .social-text {
        color: grey;
      }

      .contact-icon {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>

  <h1>MOTION</h1>

  <div class="navbar">
    <a href="index.html">HOME</a>
    <a href="motion.html">MOTION</a>
    <a href="yousif.html">YOUSIF</a>
    <a href="clicksphoto.html">CLICKS</a>
    <a href="contact.html">CONTACT</a>
  </div>

  <div class="videos">
    <!-- Your video-container blocks go here (unchanged) -->
  </div>

  <div class="contact-section">
    <p class="contact-email">Email: test@example.com</p>
    <div class="contact-icons">
      <a href="https://www.instagram.com/yousefkadry1/" target="_blank" rel="noopener noreferrer">
        <img src="images/instalogo.png" alt="Instagram" class="contact-icon" />
        <span class="social-text">Instagram</span>
      </a>
      <a href="https://www.youtube.com/@yousifkadry1" target="_blank" rel="noopener noreferrer">
        <img src="images/youtubelogo.png" alt="YouTube" class="contact-icon" />
        <span class="social-text">YouTube</span>
      </a>
      <a href="https://www.linkedin.com/in/yossef-kadry-b92062144/" target="_blank" rel="noopener noreferrer">
        <img src="images/linkedinlogo.png" alt="LinkedIn" class="contact-icon" />
        <span class="social-text">LinkedIn</span>
      </a>
    </div>
  </div>

  <script>
    function isMobile() {
      return /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth <= 768;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const videos = document.querySelectorAll('video.content-video');
      videos.forEach(video => {
        if (isMobile()) {
          const mobileSrc = video.getAttribute('data-mobile-src');
          const sourceEl = video.querySelector('source');
          if (mobileSrc && sourceEl && !sourceEl.src.includes(mobileSrc)) {
            sourceEl.src = mobileSrc;
            video.load();
          }
          video.preload = 'none';
        }

        video.addEventListener('play', () => {
          videos.forEach(other => {
            if (other !== video) other.pause();
          });
        });

        if ('IntersectionObserver' in window) {
          const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
              if (entry.isIntersecting && video.preload === 'none') {
                video.preload = 'metadata';
                video.load();
                observer.unobserve(video);
              }
            });
          }, { rootMargin: '200px' });
          observer.observe(video);
        }
      });
    });
  </script>

</body>
</html>
